[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = yes
log_membername_as_agent = yes

[tpl-queue](!)
musicclass = default
strategy = rrmemory
timeout = 20
retry = 3
wrapuptime = 5
maxlen = 0
announce-frequency = 60
announce-position = yes
announce-holdtime = yes
periodic-announce-frequency = 90
joinempty = yes
leavewhenempty = no
ringinuse = no
setinterfacevar = yes
setqueueentryvar = yes
setqueuevar = yes

#include tenants/queues-all.conf

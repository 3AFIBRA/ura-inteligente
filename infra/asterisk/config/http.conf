[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; TLS direto no Asterisk (opcional; o Caddy ja termina TLS em 443 e repassa /ws)
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.crt
tlsprivatekey = /etc/asterisk/keys/asterisk.key
enablestatic = no
sessionlimit = 500
